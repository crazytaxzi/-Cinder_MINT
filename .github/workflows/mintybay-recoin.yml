name: MintyBay recoin

on:
  push:
    branches: [MintyFilter]
    paths:
      - '.github/workflows/mintybay-recoin.yml'

permissions:
  contents: write

jobs:
  recoin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MintyFilter

      - name: Apply MintyBay user-facing naming
        shell: pwsh
        run: |
          $xaml = 'src/Cinder.MINT.App/MainWindow.xaml'
          $text = Get-Content $xaml -Raw
          $text = $text.Replace('MINT PATCH CANVAS', 'MINTYBAY')
          Set-Content $xaml $text -Encoding utf8

          $code = 'src/Cinder.MINT.App/MainWindow.xaml.cs'
          $text = Get-Content $code -Raw
          $text = $text.Replace('EDIT PATCHBAY SHORTCUTS…', 'EDIT MINTYBAY SHORTCUTS…')
          $text = $text.Replace('Patchbay shortcuts saved —', 'MintyBay shortcuts saved —')
          Set-Content $code $text -Encoding utf8

          $dialogs = 'src/Cinder.MINT.App/Controls/PatchbayDialogs.cs'
          $text = Get-Content $dialogs -Raw
          $text = $text.Replace('Remove from MintyFilter patch', 'Remove from MintyBay')
          $text = $text.Replace('This changes the patch graph.', 'This changes the MintyBay graph.')
          $text = $text.Replace('MintyFilter Patchbay Shortcuts', 'MintyFilter MintyBay Shortcuts')
          $text = $text.Replace('PATCHBAY SHORTCUTS', 'MINTYBAY SHORTCUTS')
          Set-Content $dialogs $text -Encoding utf8

          $doc = 'docs/PATCHBAY-INTERACTIONS.md'
          $text = Get-Content $doc -Raw
          $text = $text.Replace('MintyFilter Patchbay Interaction Specification', 'MintyFilter MintyBay Interaction Specification')
          $text = $text.Replace('The patchbay is an editor first.', 'MintyBay is an editor first.')
          $text = $text.Replace('The patchbay follows this priority:', 'MintyBay follows this priority:')
          $text = $text.Replace('Edit Patchbay Shortcuts...', 'Edit MintyBay Shortcuts...')
          $text = $text.Replace('patchbay-hotkeys.json', 'patchbay-hotkeys.json')
          Set-Content $doc $text -Encoding utf8

      - name: Commit MintyBay naming
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cinder.MINT.App/MainWindow.xaml src/Cinder.MINT.App/MainWindow.xaml.cs src/Cinder.MINT.App/Controls/PatchbayDialogs.cs docs/PATCHBAY-INTERACTIONS.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'ui: recoin patchbay as MintyBay'
          git push origin HEAD:MintyFilter
