name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.3"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.3]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.3"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          Device dropdown visual hotfix for the public test build.

          Fixed:
          - Replaced the light Windows ComboBox popup palette with the Cinder dark theme.
          - Added readable normal, hover, selected, and disabled device-item states.
          - Limited dropdown height and disabled useless horizontal scrolling.
          - Darkened popup and scrollbar system resources for consistent contrast.
          - Includes the alpha.2 one-way meter binding startup fix.

          Test notes:
          - Extract the ZIP into a fresh folder before launching Cinder.MINT.App.exe.
          - Device lists should now remain readable instead of showing white text on a white popup.
          - Route RVC or application audio through dedicated VB-Cable endpoints for clean isolation.
          - This remains an early prerelease. Screenshots of ugly or broken behavior are extremely useful.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
