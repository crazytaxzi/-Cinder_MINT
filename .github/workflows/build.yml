name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.8"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.8]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.8"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          Built-in AI Noise Filter preview.

          Changed:
          - Added AI Noise Filter: a dedicated compact neural specialist controlling a deterministic low-latency spectral suppressor.
          - Uses 512-point sqrt-Hann overlap-add processing at 48 kHz with roughly 10.7 ms analysis latency.
          - Exposes simple maximum reduction, sensitivity, speech/RVC protection, strength, naturalness, and adaptation intent controls.
          - Starter voice/RVC route now runs AI Noise Filter before AI Cleanup, Tone, Dynamics, and Loudness.
          - AI node shelf now exposes the specialist nodes directly instead of only a generic AI box.
          - Neural control remains per-node and isolated; waveform processing remains deterministic and no audio is generated.
          - Retains the alpha.7 realtime/UI thread-isolation fix plus all routing and feedback guards.
          - CI validates neural control bounds and confirms AI Noise sits immediately upstream of AI Cleanup.

          Test notes:
          - Extract into a fresh folder before launching Cinder.MINT.App.exe.
          - Use RESET TO AI PATCH once if an older saved graph is restored.
          - Start with AI Noise maximum reduction around 20-26 dB and speech protection around 85-90% for voice/RVC.
          - Watch HEARD / DECISION telemetry while speaking and during room-noise-only periods.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
