name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.6"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.6]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.6"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          Independent AI specialist-brain preview.

          Changed:
          - Added true per-node neural controllers for AI Cleanup, AI Tone, AI Dynamics, AI Loudness, and AI Master.
          - Every AI node keeps independent adaptive history and telemetry while sharing compact model weights/runtime infrastructure.
          - AI analyzes its own node input and controls a private bounded DSP profile; it never fabricates or replaces waveform audio.
          - AI Cleanup includes voice/RVC-aware artifact, noise, plosive, and sibilance analysis.
          - AI Master is placed only after an explicit MIX BUS in the starter graph.
          - Added intent-first controls for strength, naturalness, maximum correction, transient preservation, consistency, target loudness, and adaptation speed.
          - Added live HEARD / DECISION / confidence telemetry to AI node inspectors.
          - Retains isolated capture branches, explicit-only audible summing, endpoint loop validation, sidechain separation, and runaway-feedback safety stop.
          - CI now checks neural control bounds, independent brain state, AI Master topology, and all existing routing safety cases.

          AI note:
          - The initial compact specialist neural weights are trained on synthetic acoustic scenarios. This is real neural inference controlling deterministic DSP, but real-world audio calibration/training remains an upcoming quality pass.

          Test notes:
          - Extract into a fresh folder before launching Cinder.MINT.App.exe.
          - Reset to the AI starter patch to see the new specialist layout if you have settings from an older alpha.
          - Select an AI node to see its intent controls and live decision telemetry while MINT is running.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
