name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.9"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.9]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.9"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          AI Noise Filter V2 — one-node-strength preview.

          Changed:
          - Reworked the AI Noise Filter so stacking multiple noise nodes should not be necessary.
          - Added a fast realtime VAD/noise-floor layer beneath the per-node neural controller.
          - Added minimum-statistics spectral estimation and substantially stronger bounded spectral subtraction.
          - Added a non-speech expander that can push room-tone rejection past 50 dB between words while protecting the voice band during speech.
          - Added automatic dominant-channel handling for clearly mismatched stereo voice/RVC inputs.
          - Neural observations remain detached from WPF/UI state and retain the alpha.7 thread-isolation fix.
          - No audio generation: the neural brain controls deterministic DSP only.
          - All routing, explicit-mix, endpoint-loop and runaway-feedback protections remain enabled.

          Test notes:
          - Extract into a fresh folder before launching Cinder.MINT.App.exe.
          - Use RESET TO AI PATCH if an older graph restores multiple AI Noise nodes.
          - Test with ONE AI Noise node first. Set Maximum noise reduction to 36 dB, Noise sensitivity near 80-100%, and Protect speech/RVC around 85-95%.
          - If one node still cannot control the room, send a fresh post-node recording rather than stacking more nodes; that is now treated as a denoiser tuning bug.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
