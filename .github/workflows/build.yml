name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix read-only meter bindings
        shell: pwsh
        run: |
          $path = ".\src\Cinder.MINT.App\MainWindow.xaml"
          $content = Get-Content -Path $path -Raw
          $content = $content.Replace('Value="{Binding VoiceMeter}"', 'Value="{Binding VoiceMeter, Mode=OneWay}"')
          $content = $content.Replace('Value="{Binding ProgramMeter}"', 'Value="{Binding ProgramMeter, Mode=OneWay}"')
          $content = $content.Replace('Value="{Binding MasterMeter}"', 'Value="{Binding MasterMeter, Mode=OneWay}"')
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

      - name: Commit binding hotfix
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $path = "src/Cinder.MINT.App/MainWindow.xaml"
          git diff --quiet -- $path
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $path
            git commit -m "Fix one-way meter bindings"
            git push origin HEAD:main
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.2"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.2]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.2"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          Startup hotfix for the first public test build.

          Fixed:
          - Meter ProgressBars now use explicit one-way bindings.
          - Prevents WPF from attempting to write into the read-only VoiceMeter, ProgramMeter, and MasterMeter properties.
          - Fixes the startup exception reported in v0.1.0-alpha.1.

          Included:
          - Voice, microphone, virtual-device, and RVC output cleanup lane
          - Music and application audio lane through Windows/VB-Audio endpoints
          - Adaptive level riding, de-essing, EQ, compression, ducking, and limiting
          - Draggable visual signal graph
          - Cinder Stream neon interface
          - Saved presets, endpoint recovery, and feedback-loop protection

          Test notes:
          - Extract the ZIP before launching Cinder.MINT.App.exe.
          - Route RVC or application audio through dedicated VB-Cable endpoints for clean isolation.
          - This remains an early prerelease. Report the exact dialog or behavior if another gremlin crawls out.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
