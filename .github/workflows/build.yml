name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Normalize endpoint cycle detector
        shell: pwsh
        run: |
          $path = ".\src\Cinder.MINT.App\Models\AudioGraphModel.cs"
          $content = Get-Content -Path $path -Raw
          $pattern = '(?s)    private static bool TryFindEndpointCycle\(.*?\n    public static AudioGraphModel CreateDefault\(\)'
          $replacement = @'
    private static bool TryFindEndpointCycle(
        IReadOnlyDictionary<string, HashSet<string>> edges,
        out List<string> cycle)
    {
        var state = new Dictionary<string, int>(StringComparer.OrdinalIgnoreCase);
        var path = new List<string>();
        List<string> foundCycle = [];

        bool Visit(string key)
        {
            state[key] = 1;
            path.Add(key);

            if (edges.TryGetValue(key, out HashSet<string>? targets))
            {
                foreach (string target in targets)
                {
                    if (!state.TryGetValue(target, out int targetState))
                    {
                        if (Visit(target)) return true;
                    }
                    else if (targetState == 1)
                    {
                        int start = path.FindIndex(x => string.Equals(x, target, StringComparison.OrdinalIgnoreCase));
                        foundCycle = path.Skip(Math.Max(0, start)).Append(target).ToList();
                        return true;
                    }
                }
            }

            path.RemoveAt(path.Count - 1);
            state[key] = 2;
            return false;
        }

        foreach (string key in edges.Keys)
        {
            if (!state.ContainsKey(key) && Visit(key))
            {
                cycle = foundCycle;
                return true;
            }
        }

        cycle = [];
        return false;
    }

    public static AudioGraphModel CreateDefault()
'@
          $updated = [regex]::Replace($content, $pattern, $replacement)
          if ($updated -eq $content) {
            throw "Endpoint cycle detector patch did not match."
          }
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "Fix endpoint cycle detector closure"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.5"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.5]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.5"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          Routing isolation and feedback safety release.

          Changed:
          - Every input node now owns one isolated capture domain.
          - Split branches receive independent synchronized buffers.
          - Audible signals can only combine inside an explicit MIX BUS.
          - Sidechains remain control-only and are never added to the audible path.
          - Duplicate input and output endpoint assignments are blocked.
          - Virtual cable pair conflicts and cross-output endpoint cycles are blocked before start.
          - Sustained full-scale runaway output is muted by a runtime feedback guard.

          Test notes:
          - Extract into a fresh folder before launching Cinder.MINT.App.exe.
          - Use one INPUT node per endpoint; split its OUT socket for parallel processing.
          - Merge signals into one MIX BUS before sending them to a shared OUTPUT endpoint.
          - External software can still create a loop after startup; use distinct virtual buses in each direction.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
