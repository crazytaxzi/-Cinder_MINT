name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        if: github.event_name == 'push'
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Cinder-MINT-win-x64

      - name: Package test release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "v0.1.0-alpha.7"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\Cinder-MINT-win-x64\*" -DestinationPath $zip -Force

      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Cinder-MINT-win-x64
          path: artifacts/Cinder-MINT-win-x64/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0-alpha.7]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0-alpha.7"
          $zip = ".\artifacts\Cinder-MINT-$version-win-x64.zip"
          $target = (git rev-parse HEAD).Trim()

          @"
          # Cinder MINT $version

          AI realtime/UI thread-isolation hotfix.

          Changed:
          - AI callbacks now use detached intent/runtime profiles and never dereference live UI-bound node state.
          - Fixed the alpha.6 path where realtime AI parameter updates could inherit UI PropertyChanged subscribers and touch WPF DispatcherTimer state from the audio thread.
          - Added a regression check that fails if the realtime AI provider retains an AudioNodeModel or leaks UI profile subscribers into runtime state.
          - Retains independent specialist brains, bounded deterministic DSP, isolated routing, explicit-only mixing, endpoint loop validation, and runaway-feedback protection.

          Test notes:
          - Extract into a fresh folder before launching Cinder.MINT.App.exe.
          - Use RESET TO AI PATCH if an older saved graph is loaded.
          - Start the graph and leave an AI node selected so HEARD / DECISION telemetry is active while testing.
          "@ | Set-Content -Path ".\release-notes.md" -Encoding utf8

          gh release create $version $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "Cinder MINT $version" `
            --notes-file ".\release-notes.md" `
            --prerelease
