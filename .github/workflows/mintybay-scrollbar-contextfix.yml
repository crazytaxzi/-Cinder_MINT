name: MintyBay scrollbar context fix

on:
  push:
    branches: [MintyFilter-mintybay-scrollbar-contextfix]
    paths:
      - '.github/workflows/mintybay-scrollbar-contextfix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MintyFilter-mintybay-scrollbar-contextfix

      - name: Suppress native WPF scrollbar context menu
        shell: pwsh
        run: |
          $xaml = 'src/Cinder.MINT.App/MainWindow.xaml'
          $text = Get-Content $xaml -Raw
          $old = '                                  ScrollChanged="GraphScroll_ScrollChanged">'
          $new = "                                  ScrollChanged=`"GraphScroll_ScrollChanged`"`r`n                                  ContextMenuOpening=`"GraphScroll_ContextMenuOpening`">"
          if (-not $text.Contains($old)) { throw 'GraphScroll anchor not found in MainWindow.xaml' }
          $text = $text.Replace($old, $new)
          Set-Content $xaml $text -Encoding utf8

          $code = 'src/Cinder.MINT.App/MainWindow.xaml.cs'
          $text = Get-Content $code -Raw
          $old = '    private void GraphScroll_ScrollChanged(object sender, ScrollChangedEventArgs e) => PositionInspector();'
          $new = @'
    private void GraphScroll_ScrollChanged(object sender, ScrollChangedEventArgs e) => PositionInspector();

    private void GraphScroll_ContextMenuOpening(object sender, ContextMenuEventArgs e)
    {
        // WPF ScrollBar injects its own bright native menu (Scroll Here / Page Left / etc.).
        // MintyBay owns right-click interaction, so suppress every implicit scroller menu here.
        e.Handled = true;
    }
'@
          if (-not $text.Contains($old)) { throw 'GraphScroll handler anchor not found in MainWindow.xaml.cs' }
          $text = $text.Replace($old, $new.TrimEnd())
          Set-Content $code $text -Encoding utf8

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cinder.MINT.App/MainWindow.xaml src/Cinder.MINT.App/MainWindow.xaml.cs
          git commit -m 'fix: suppress native scrollbar context menu in MintyBay'
          git push origin HEAD:MintyFilter-mintybay-scrollbar-contextfix
