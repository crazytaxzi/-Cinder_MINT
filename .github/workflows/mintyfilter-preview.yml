name: MintyFilter preview

on:
  push:
    branches: [MintyFilter]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\MintyFilter-win-x64

      - name: Package preview
        shell: pwsh
        run: |
          $version = "v0.2.0-mintyfilter-preview.3"
          $zip = ".\artifacts\MintyFilter-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\MintyFilter-win-x64\*" -DestinationPath $zip -Force
          "MINTYFILTER_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintyFilter-v0.2.0-mintyfilter-preview.3-win-x64
          path: artifacts/MintyFilter-win-x64/**
          if-no-files-found: error

      - name: Publish MintyFilter prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.2.0-mintyfilter-preview.3"
          $target = (git rev-parse HEAD).Trim()
          @"
          # MintyFilter $version

          First control-deck-first MintyFilter preview.

          Test focus:
          - MintyFilter opens to the friendly Overview instead of MintyBay.
          - Input and processed-output selectors edit the same graph used by MintyBay.
          - Use-case presets: RVC Live, RVC Polish, Podcast Natural, Podcast Studio, Streaming, Voice Chat and Raw Rescue.
          - Overall Treatment and Naturalness tune the live specialist profiles.
          - Noise, Cleanup, Tone, Dynamics and Output Level controls map to the real AI nodes.
          - Input/output meters and AI Noise telemetry update on the Overview.
          - Devices, Processing and Diagnostics pages expose real graph state rather than a second settings model.
          - Open MintyBay reveals the advanced graph editor; Control Deck returns to the friendly interface.
          - Existing MintyBay gestures, routing isolation, AI bounds and feedback protections remain enabled.

          Known scope:
          - Current engine backend remains WASAPI in this preview; MME/WDM-KS/ASIO are an upcoming backend-adapter milestone.
          - The executable still uses the Cinder.MINT.App.exe internal name while product rebranding continues.
          "@ | Set-Content -Path ".\release-notes-mintyfilter.md" -Encoding utf8

          gh release delete $version --repo "$env:GITHUB_REPOSITORY" --yes 2>$null
          git push origin ":refs/tags/$version" 2>$null
          gh release create $version $env:MINTYFILTER_ZIP `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "MintyFilter $version" `
            --notes-file ".\release-notes-mintyfilter.md" `
            --prerelease
