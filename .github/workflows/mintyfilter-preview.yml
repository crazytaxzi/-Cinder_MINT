name: MintyFilter preview

on:
  push:
    branches: [MintyFilter]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cinder.MINT.sln

      - name: Build
        run: dotnet build Cinder.MINT.sln -c Release --no-restore

      - name: Routing and AI safety checks
        run: dotnet run --project .\tests\Cinder.MINT.RoutingChecks\Cinder.MINT.RoutingChecks.csproj -c Release

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish .\src\Cinder.MINT.App\Cinder.MINT.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\MintyFilter-win-x64

      - name: Package preview
        shell: pwsh
        run: |
          $version = "v0.2.0-mintyfilter-preview.5"
          $zip = ".\artifacts\MintyFilter-$version-win-x64.zip"
          Compress-Archive -Path ".\artifacts\MintyFilter-win-x64\*" -DestinationPath $zip -Force
          "MINTYFILTER_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintyFilter-v0.2.0-mintyfilter-preview.5-win-x64
          path: artifacts/MintyFilter-win-x64/**
          if-no-files-found: error

      - name: Publish MintyFilter prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.2.0-mintyfilter-preview.5"
          $target = (git rev-parse HEAD).Trim()
          @"
          # MintyFilter $version

          Control Deck and MintyBay hotfix preview.

          Fixes:
          - Fixes the Control Deck crash caused by a TwoWay binding targeting the read-only OutputMeter property.
          - Makes both InputMeter and OutputMeter progress bindings explicitly OneWay telemetry.
          - Removes the native bright WPF scrollbar right-click menu from MintyBay.
          - Uses MintyBay's own shortcut parser so plain N, R and B shortcuts are valid.
          - Repairs legacy None+N-style shortcut strings automatically.
          - Escape remains reserved as the safe cancel action.

          Existing test focus:
          - Open the Control Deck and verify both live meters render/update without a binding exception.
          - Mouse wheel pans vertically; Alt+wheel pans horizontally; Ctrl+wheel zooms around the cursor.
          - Right-drag pans MintyBay; stationary right-click opens MintyBay context actions.
          - Dragging sockets creates cables without opening node controls.
          - Clicking or dragging nodes does not open controls automatically.
          - Empty-canvas drag creates a marquee selection; selected nodes move as a group.
          - N opens add-node-at-cursor; R removes the hovered node/cable only after explicit confirmation.
          - MintyBay shortcuts are user-editable and persist separately from the audio graph.
          - Existing routing, AI, and feedback safety checks remain enabled.

          Known scope:
          - Current engine backend remains WASAPI in this preview; MME/WDM-KS/ASIO are an upcoming backend-adapter milestone.
          - The executable still uses the Cinder.MINT.App.exe internal name while product rebranding continues.
          "@ | Set-Content -Path ".\release-notes-mintyfilter.md" -Encoding utf8

          gh release delete $version --repo "$env:GITHUB_REPOSITORY" --yes 2>$null
          git push origin ":refs/tags/$version" 2>$null
          gh release create $version $env:MINTYFILTER_ZIP `
            --repo "$env:GITHUB_REPOSITORY" `
            --target $target `
            --title "MintyFilter $version" `
            --notes-file ".\release-notes-mintyfilter.md" `
            --prerelease
